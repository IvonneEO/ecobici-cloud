AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Ecobici Cloud: ingesta del feed GBFS de Ecobici y del clima de Open-Meteo a S3,
  Job de Glue diario raw -> curated (Parquet), catálogo para Athena, ciclo de vida,
  monitoreo y presupuesto.

Parameters:
  AlertEmail:
    Type: String
    Description: Correo que recibe las alarmas y los avisos de presupuesto (hay que confirmar la suscripción).
  MonthlyBudgetUSD:
    Type: Number
    Default: 5
    Description: Presupuesto mensual de la cuenta en USD (sin descontar créditos).
  DataStartDate:
    Type: String
    Default: "2026-11-01"
    Description: Primera fecha (yyyy-MM-dd) que Athena considera al proyectar particiones.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    Environment:
      Variables:
        ECOBICI_STORAGE: s3
        ECOBICI_BUCKET: !Ref DataBucket

Resources:
  # ---------------------------------------------------------------- Almacenamiento
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # si se borra el stack, los datos se conservan
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256  # SSE-S3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Ciclo de vida (ver E2_EQxx/README.md, sección de costos y retención):
      # - bronze/ (JSON de ~7 KB por snapshot) no puede pasar a Glacier (mínimo 128 KB),
      #   así que el Job de Glue lo archiva a diario en archive/ y los individuales expiran.
      LifecycleConfiguration:
        Rules:
          - Id: raw-individual-expira-30-dias
            Status: Enabled
            Prefix: bronze/
            ExpirationInDays: 30
          - Id: raw-archivo-diario-a-glacier
            Status: Enabled
            Prefix: archive/
            Transitions:
              - {StorageClass: GLACIER_IR, TransitionInDays: 30}
              - {StorageClass: DEEP_ARCHIVE, TransitionInDays: 365}
          - Id: curated-a-acceso-infrecuente
            Status: Enabled
            Prefix: silver/
            Transitions:
              - {StorageClass: STANDARD_IA, TransitionInDays: 90}
          - Id: athena-results-expira-7-dias
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
          - Id: limpiar-cargas-incompletas
            Status: Enabled
            Prefix: ""
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: proyecto
          Value: ecobici-cloud

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: SoloHTTPS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------- Logs (14 días)
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecobici/${AWS::StackName}/ingest"
      RetentionInDays: 14

  # ---------------------------------------------------------------- Lambdas
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Guarda en bronze el estado de estaciones (cada 2 min) y el clima (cada hora).
      Handler: ecobici.aws.ingest.handler
      MemorySize: 256
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 120   # un snapshot de hace más de 2 min ya no sirve
        MaximumRetryAttempts: 1
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${DataBucket.Arn}/bronze/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: ["bronze/*"]
      Events:
        EstadoCada2Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(2 minutes)
            Input: '{"task": "status"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
        ClimaCadaHora:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)
            Input: '{"task": "weather"}'
            RetryPolicy:
              MaximumRetryAttempts: 2

  # ---------------------------------------------------------------- Glue: raw -> curated
  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: glue.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: curate-minimo-privilegio
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${DataBucket.Arn}/bronze/*"
                  - !Sub "${DataBucket.Arn}/glue/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "${DataBucket.Arn}/silver/*"
                  - !Sub "${DataBucket.Arn}/archive/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: ["bronze/*"]

  CurateJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${AWS::StackName}-curate"
      Description: Convierte el raw (bronze) del día anterior en Parquet particionado (silver) y archiva el crudo.
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${DataBucket}/glue/curate_job.py"
      MaxCapacity: 0.0625          # la capacidad mínima de Glue: ~0.0005 USD por corrida
      Timeout: 30                  # minutos
      MaxRetries: 1
      ExecutionProperty:
        MaxConcurrentRuns: 1
      DefaultArguments:
        "--ECOBICI_BUCKET": !Ref DataBucket
        "--PACKAGE_KEY": glue/libs/ecobici.zip
        library-set: analytics     # pandas, pyarrow y boto3 preinstalados
      Tags:
        proyecto: ecobici-cloud

  CurateTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub "${AWS::StackName}-curate-diario"
      Description: Todos los días a las 00:15 UTC (18:15 en CDMX) procesa el día UTC anterior.
      Type: SCHEDULED
      Schedule: cron(15 0 * * ? *)
      StartOnCreation: true
      Actions:
        - JobName: !Ref CurateJob

  CurateFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Avisa por correo si el Job de Glue falla o se pasa de tiempo.
      EventPattern:
        source: [aws.glue]
        detail-type: [Glue Job State Change]
        detail:
          jobName: [!Ref CurateJob]
          state: [FAILED, TIMEOUT, ERROR]
      Targets:
        - Id: correo
          Arn: !Ref AlertsTopic

  # ---------------------------------------------------------------- Catálogo y Athena
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: ecobici
        Description: Capa silver del proyecto Ecobici Cloud

  FactStationStatusTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: fact_station_status
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: !Sub "${DataStartDate},NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${DataBucket}/silver/fact_station_status/dt=${!dt}/"
        PartitionKeys:
          - {Name: dt, Type: string}
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/silver/fact_station_status/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: station_id, Type: string}
            - {Name: num_bikes_available, Type: smallint}
            - {Name: num_bikes_disabled, Type: smallint}
            - {Name: num_docks_available, Type: smallint}
            - {Name: num_docks_disabled, Type: smallint}
            - {Name: is_installed, Type: boolean}
            - {Name: is_renting, Type: boolean}
            - {Name: is_returning, Type: boolean}
            - {Name: last_reported, Type: bigint}
            - {Name: last_reported_ts, Type: timestamp}
            - {Name: feed_last_updated_ts, Type: timestamp}
            - {Name: ingested_at, Type: timestamp}
            - {Name: dq_sin_catalogo, Type: boolean}
            - {Name: dq_negativo, Type: boolean}
            - {Name: dq_excede_capacidad, Type: boolean}
            - {Name: dq_reporte_viejo, Type: boolean}
            - {Name: dq_fuera_servicio, Type: boolean}
            - {Name: dq_duplicado, Type: boolean}
            - {Name: dq_ok, Type: boolean}
            - {Name: en_horario, Type: boolean}

  DimStationTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: dim_station
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: !Sub "${DataStartDate},NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${DataBucket}/silver/dim_station/dt=${!dt}/"
        PartitionKeys:
          - {Name: dt, Type: string}
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/silver/dim_station/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: station_id, Type: string}
            - {Name: name, Type: string}
            - {Name: short_name, Type: string}
            - {Name: lat, Type: double}
            - {Name: lon, Type: double}
            - {Name: capacity, Type: smallint}

  FactWeatherHourlyTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: fact_weather_hourly
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: !Sub "${DataStartDate},NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${DataBucket}/silver/fact_weather_hourly/dt=${!dt}/"
        PartitionKeys:
          - {Name: dt, Type: string}
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/silver/fact_weather_hourly/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: ts_hour, Type: timestamp}
            - {Name: temperature_2m, Type: double}
            - {Name: precipitation, Type: double}
            - {Name: rain, Type: double}
            - {Name: wind_speed_10m, Type: double}
            - {Name: weather_code, Type: double}

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${AWS::StackName}"
      Description: Consultas del proyecto Ecobici con tope de datos por consulta
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824   # 1 GB por consulta = máx. ~0.005 USD
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DataBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  # ---------------------------------------------------------------- Monitoreo
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Ecobici Cloud alertas
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertsTopic]
      PolicyDocument:
        Statement:
          - Sid: DuenoDeLaCuenta
            Effect: Allow
            Principal: {AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"}
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref AlertsTopic
          - Sid: AlarmasDeCloudWatch
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
          - Sid: FallasDelJobDeGlue
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              ArnEquals: {aws:SourceArn: !GetAtt CurateFailureRule.Arn}

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: La ingesta falló 3 o más veces en 10 minutos.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref IngestFunction}]
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  IngestStoppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: La ingesta no se ejecutó en 15 minutos (el scheduler o la función están detenidos).
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{Name: FunctionName, Value: !Ref IngestFunction}]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-mensual"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
        CostTypes:
          IncludeCredit: false   # mide el gasto real aunque lo cubran los créditos
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

Outputs:
  BucketName:
    Description: Bucket con las capas bronze y silver
    Value: !Ref DataBucket
  IngestFunctionName:
    Value: !Ref IngestFunction
  CurateJobName:
    Description: Job de Glue raw -> curated
    Value: !Ref CurateJob
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
