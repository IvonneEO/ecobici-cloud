[project]
name = "ecobici-cloud"
version = "0.2.0"
requires-python = ">=3.9"
# La ingesta solo usa la librería estándar; pandas/pyarrow son para silver y análisis.
dependencies = ["pandas>=2.1", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8", "boto3>=1.34", "moto[s3]>=5", "pyyaml>=6", "cfn-lint>=1", "scikit-learn>=1.4"]
# Notebooks y modelado: pip install -e ".[ml]"
ml = ["scikit-learn>=1.4", "matplotlib>=3.8", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
